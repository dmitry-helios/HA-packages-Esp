get_deliveries:
  name: Get deliveries
  description: Get deliveries for a configured Packages España account.
  fields:
    entry_id:
      name: Account entry ID
      description: Required only when more than one account is configured.
      selector:
        text:
    parcel_id:
      name: Parcel ID
      required: false
      selector:
        text:
get_summary:
  name: Get spoken summary
  description: Get spoken summary for a configured Packages España account.
  fields:
    entry_id:
      name: Account entry ID
      description: Required only when more than one account is configured.
      selector:
        text:
    day:
      name: Day
      default: today
      selector:
        select:
          options:
            - today
            - tomorrow
    language:
      name: Language
      selector:
        select:
          options:
            - en
            - es
    hide_items:
      name: Hide item descriptions
      selector:
        boolean:
